<!DOCTYPE html>
<html lang="ru" class="page__inner blog-page">
@@include('blocks/head.html', {"title": "Pirsib"})

<body>
  <div class="wrapper">
    <!-- Шапка -->
    @@include('./blocks/header.html')
    <!-- Секции страницы -->
    <main class="main">

      <section class="template">
        <div class="container">
          <div class="template__inner">
            <div class="breadcrumbs">
              <ul>
                <li>
                  <a href="/Pirsib">
                    Главная
                  </a>
                </li>
                <li>
                  Блог
                </li>
              </ul>
            </div>
            <div class="general__head">
              <div class="general__title">
                <h1 data-gradient-text>
                  Блог
                </h1>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="blog">
        <div class="container">
          <div class="blog__inner">

            <div class="general__head">
              <div class="filter">
                <div class="filter__items">
                  <label class="filter__item filter__item--active">
                    <span class="border"></span>
                    <input type="radio" name="blog-filter" class="filter__input" checked="">
                    <span>
                      Татуировки
                    </span>
                  </label>
                  <label class="filter__item">
                    <span class="border"></span>
                    <input type="radio" name="blog-filter" class="filter__input" checked="">
                    <span>
                      Пирсинг
                    </span>
                  </label>
                  <label class="filter__item">
                    <span class="border"></span>
                    <input type="radio" name="blog-filter" class="filter__input" checked="">
                    <span>
                      Разное
                    </span>
                  </label>
                </div>
              </div>
            </div>
            <div class="blog__items" data-animation="blur">
              @@loop('./elements/blog-item.html', './data/blog-items.json')
            </div>

          </div>
        </div>
      </section>

      <section class="directions">
        <div class="directions__container container">
          <div class="directions__inner">
            <div class="general__head">
              <div class="general__title" data-transform="titleFadeUp">
                <h2 data-gradient-text>
                  Направления студии
                </h2>
              </div>
            </div>
            <div class="directions__body" data-animation="blur">
              <div class="directions__items">
                <a class="directions__item" href="/Pirsib/catalog-piercing.html">
                  <span class="border"></span>
                  <div class="directions__item-title h5">
                    Пирсинг
                  </div>
                  <div class="btn">
                    <span class="border"></span>
                    <i class="icon-chevron-min"></i>
                  </div>
                  <div class="directions__item-img">
                    <img src="./../images/temp/directions-nofilter-1.png" alt="" loading="lazy">
                  </div>
                </a>
                <a class="directions__item" href="/Pirsib/catalog-tatu.html">
                  <span class="border"></span>
                  <div class="directions__item-title h5">
                    Татуировки
                  </div>
                  <div class="btn">
                    <span class="border"></span>
                    <i class="icon-chevron-min"></i>
                  </div>
                  <div class="directions__item-img">
                    <img src="./../images/temp/directions-nofilter-2.png" alt="" loading="lazy">
                  </div>
                </a>
                <a class="directions__item" href="/Pirsib/laser-removal.html">
                  <span class="border"></span>
                  <div class="directions__item-title h5">
                    Удаление татуировки
                  </div>
                  <div class="btn">
                    <span class="border"></span>
                    <i class="icon-chevron-min"></i>
                  </div>
                  <div class="directions__item-img">
                    <img src="./../images/temp/directions-nofilter-3.png" alt="" loading="lazy">
                  </div>
                </a>
                <a class="directions__item" href="/Pirsib/catalog-product.html">
                  <span class="border"></span>
                  <div class="directions__item-title h5">
                    Украшения
                    и&nbsp;косметика для <br>
                    ухода
                  </div>
                  <div class="btn">
                    <span class="border"></span>
                    <i class="icon-chevron-min"></i>
                  </div>
                  <div class="directions__item-img">
                    <picture>
                      <source media="(min-width: 835px)" srcset="./../images/temp/directions-nofilter-4.png"
                        type="image/png">
                      <source media="(max-width: 834px)" srcset="./../images/temp/directions-nofilter-mob-4.png"
                        type="image/png">
                      <img src="./../images/temp/directions-nofilter-4.png" alt="" loading="lazy">
                    </picture>
                  </div>
                </a>
              </div>
            </div>
          </div>

          <div class="mask mask--1" data-animation="parallax-box"></div>
        </div>
      </section>

    </main>

    @@include('blocks/footer.html')
